# Copy this file to .github/workflows/weekly-journal.yml in the repository
# where you want journal entries committed. It is an example, not an active
# workflow in this project.
name: Weekly Engineering Journal

on:
  schedule:
    - cron: "0 9 * * MON"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout journal tool
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dani-aisystems/weekly-engineering-journal
          ref: 09bc881d66cfed0fbdb79829b50433f8f68cfb40
          path: .weekly-engineering-journal-tool
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Generate journal entry
        env:
          GITHUB_TOKEN: ${{ secrets.JOURNAL_GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p journal
          FILENAME="journal/$(date +%Y-%m-%d).md"
          node .weekly-engineering-journal-tool/bin/cli.mjs --days 7 --output "$FILENAME"

      - name: Commit journal entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/
          git diff --cached --quiet || git commit -m "chore: weekly engineering journal ($(date +%Y-%m-%d))"
          git push
